openapi: 3.1.0
info:
  title: Landing Page Generator Actions
  version: 1.0.0
  description: Deterministic no-auth utilities. Configure the server URL before importing.
servers:
  - url: https://example.com
security: []
paths:
  /build-offer-stack:
    post:
      operationId: buildOfferStack
      summary: Organize supplied offer details without inventing prices or terms.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                offer_notes:
                  type: string
                  minLength: 1
                  maxLength: 30000
                deliverables:
                  maxItems: 30
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 500
                bonuses:
                  maxItems: 30
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 500
                price:
                  type: string
                  minLength: 1
                  maxLength: 500
                guarantee:
                  type: string
                  minLength: 1
                  maxLength: 500
                payment_options:
                  maxItems: 30
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 500
              required:
                - offer_notes
              additionalProperties: false
      responses:
        "200":
          description: Result; fields are action-specific. No independent claim
            verification is implied.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    const: ok
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Structured error.
          content:
            application/json:
              schema: &a1
                type: object
                required:
                  - status
                  - error
                properties:
                  status:
                    const: error
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        "413":
          description: Structured error.
          content:
            application/json:
              schema: *a1
        "422":
          description: Structured error.
          content:
            application/json:
              schema: *a1
        "429":
          description: Structured error.
          content:
            application/json:
              schema: *a1
        "500":
          description: Structured error.
          content:
            application/json:
              schema: *a1
        "502":
          description: Structured error.
          content:
            application/json:
              schema: *a1
        "503":
          description: Structured error.
          content:
            application/json:
              schema: *a1
        "504":
          description: Structured error.
          content:
            application/json:
              schema: *a1
